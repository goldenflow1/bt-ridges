[project]
name = "meterline"
version = "1.4.0"
description = "Prepaid usage wallets: balance ledger and tenant reporting on ClickHouse"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
