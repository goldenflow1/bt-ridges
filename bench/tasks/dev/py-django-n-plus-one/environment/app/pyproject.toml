[project]
name = "pantry"
version = "3.2.1"
description = "Community recipe site: JSON API"
requires-python = ">=3.12"
dependencies = ["Django>=5.1,<5.2", "psycopg[binary]>=3.2,<3.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["recipes/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
