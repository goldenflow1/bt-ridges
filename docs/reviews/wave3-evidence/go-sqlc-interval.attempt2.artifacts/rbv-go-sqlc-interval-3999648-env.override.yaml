services:
  postgres:
    image: rbv-go-sqlc-interval-env-postgres:latest
  main:
    image: rbv-go-sqlc-interval-env-main:latest
    build:
      context: /root/bittensor/ridges/bench/tasks/heldout/go-sqlc-interval/environment
      dockerfile: Dockerfile
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy
networks:
  default:
    internal: true
